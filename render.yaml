services:
  - type: web
    name: classescontrol
    env: static
    staticPublishPath: .
    buildCommand: echo "Static site - no build needed"
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /favicon.ico
        destination: /favicon.ico
      - type: rewrite
        source: /*
        destination: /index.html
